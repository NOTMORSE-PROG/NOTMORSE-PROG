<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title description">
  <title id="title">Byte Quest: Shipyard Sprint — animated game preview</title>
  <desc id="description">An animated pixel corgi runs through a neon shipyard, collects three proof cores, and opens a portfolio portal. Click to play the real game.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050914"/>
      <stop offset="0.6" stop-color="#0b1730"/>
      <stop offset="1" stop-color="#12233b"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f3a54"/>
      <stop offset="1" stop-color="#081122"/>
    </linearGradient>
    <radialGradient id="portal" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.25" stop-color="#41e9ff" stop-opacity="0.75"/>
      <stop offset="0.7" stop-color="#7858ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#41e9ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#a8ddff" stroke-opacity="0.045"/>
    </pattern>
    <filter id="cyanGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pinkGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="screenClip"><rect x="2" y="2" width="956" height="296" rx="15"/></clipPath>
  </defs>

  <g clip-path="url(#screenClip)">
    <rect width="960" height="300" fill="url(#sky)"/>
    <rect width="960" height="300" fill="url(#grid)"/>

    <g fill="#bde8ff">
      <rect x="397" y="33" width="2" height="2" opacity=".55"/>
      <rect x="452" y="72" width="3" height="3" opacity=".75"/>
      <rect x="511" y="28" width="2" height="2" opacity=".42"/>
      <rect x="578" y="88" width="2" height="2" opacity=".8"/>
      <rect x="633" y="52" width="3" height="3" opacity=".5"/>
      <rect x="705" y="24" width="2" height="2" opacity=".7"/>
      <rect x="781" y="75" width="2" height="2" opacity=".45"/>
      <rect x="842" y="40" width="3" height="3" opacity=".6"/>
    </g>

    <circle cx="823" cy="72" r="35" fill="#8aeaff" opacity=".08" filter="url(#cyanGlow)"/>

    <g fill="#071123" opacity=".95">
      <path d="M350 218V135h68v83h22v-55h76v55h25v-92h84v92h30v-58h61v58h28v-99h76v99h29v-65h92v65z"/>
      <path d="M368 218V172h14v46zm34 0v-27h10v27zm67 0v-34h12v34zm74 0v-42h12v42zm37 0v-64h13v64zm89 0v-33h10v33zm55 0v-52h11v52zm81 0v-44h12v44zm62 0v-31h11v31z" fill="#0b2940"/>
    </g>

    <g stroke="#41e9ff" stroke-opacity=".2" stroke-width="2" fill="none">
      <path d="M338 218V75h131v143M338 93h131M338 93l87 58"/>
      <path d="M566 218V111h94v107"/>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="32" y="38" fill="#41e9ff" font-size="10" font-weight="700" letter-spacing="3">A REAL MINI-GAME BY NOTMORSE</text>
      <text x="32" y="76" fill="#f5fbff" font-size="30" font-weight="800">BYTE QUEST</text>
      <text x="32" y="101" fill="#ff9853" font-size="17" font-weight="700" letter-spacing="1">SHIPYARD SPRINT</text>
      <text x="32" y="133" fill="#91a4bb" font-size="11">MOVE  ·  JUMP  ·  COLLECT  ·  PET BYTE</text>
      <text x="32" y="154" fill="#64768d" font-size="10">COLLECT ALL THREE · OPEN THE PORTAL</text>
    </g>

    <g opacity=".95">
      <rect x="340" y="220" width="620" height="80" fill="url(#floor)"/>
      <rect x="340" y="220" width="620" height="3" fill="#41e9ff"/>
      <rect x="400" y="177" width="120" height="12" rx="2" fill="#172b43" stroke="#41e9ff" stroke-opacity=".65"/>
      <rect x="564" y="144" width="110" height="12" rx="2" fill="#172b43" stroke="#41e9ff" stroke-opacity=".65"/>
      <rect x="715" y="177" width="100" height="12" rx="2" fill="#172b43" stroke="#41e9ff" stroke-opacity=".65"/>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" font-weight="800" text-anchor="middle">
      <g filter="url(#cyanGlow)">
        <text x="459" y="143" fill="#41e9ff">BUILD</text>
        <path d="M459 150l10 10-10 10-10-10z" fill="#41e9ff">
          <animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;.2;.25;.78;.9;1" dur="8s" repeatCount="indefinite"/>
          <animateTransform attributeName="transform" type="rotate" from="0 459 160" to="360 459 160" dur="2.4s" repeatCount="indefinite"/>
        </path>
      </g>
      <g filter="url(#cyanGlow)">
        <text x="619" y="111" fill="#ffcc4d">WIN</text>
        <path d="M619 118l10 10-10 10-10-10z" fill="#ffcc4d">
          <animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;.43;.48;.78;.9;1" dur="8s" repeatCount="indefinite"/>
          <animateTransform attributeName="transform" type="rotate" from="0 619 128" to="360 619 128" dur="2.1s" repeatCount="indefinite"/>
        </path>
      </g>
      <g filter="url(#pinkGlow)">
        <text x="765" y="143" fill="#ff6b9d">LEAD</text>
        <path d="M765 150l10 10-10 10-10-10z" fill="#ff6b9d">
          <animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;.63;.68;.78;.9;1" dur="8s" repeatCount="indefinite"/>
          <animateTransform attributeName="transform" type="rotate" from="0 765 160" to="360 765 160" dur="1.9s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>

    <g opacity=".25">
      <ellipse cx="887" cy="184" rx="31" ry="45" fill="none" stroke="#6e8198" stroke-width="5"/>
      <circle cx="874" cy="184" r="4" fill="#6e8198"/>
      <circle cx="887" cy="184" r="4" fill="#6e8198"/>
      <circle cx="900" cy="184" r="4" fill="#6e8198"/>
      <animate attributeName="opacity" values=".25;.25;1;1;.25" keyTimes="0;.68;.72;.88;1" dur="8s" repeatCount="indefinite"/>
    </g>
    <g opacity="0" filter="url(#cyanGlow)">
      <ellipse cx="887" cy="184" rx="45" ry="62" fill="url(#portal)"/>
      <ellipse cx="887" cy="184" rx="27" ry="43" fill="none" stroke="#71efff" stroke-width="5" stroke-dasharray="12 8">
        <animate attributeName="stroke-dashoffset" from="0" to="-80" dur="1.7s" repeatCount="indefinite"/>
      </ellipse>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.68;.72;.9;1" dur="8s" repeatCount="indefinite"/>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate" values="350 192;430 151;540 116;705 151;835 192;850 192;350 192" keyTimes="0;.21;.43;.61;.76;.88;1" dur="8s" repeatCount="indefinite" calcMode="spline" keySplines=".3 0 .2 1;.3 0 .2 1;.3 0 .2 1;.3 0 .2 1;.3 0 .2 1;.3 0 .2 1"/>

      <ellipse cx="0" cy="27" rx="27" ry="6" fill="#000" opacity=".25"/>
      <g>
        <path d="M-26 4h-19v9h22z" fill="#d96b2b">
          <animateTransform attributeName="transform" type="rotate" values="-15 -24 8;20 -24 8;-15 -24 8" dur=".32s" repeatCount="indefinite"/>
        </path>
        <rect x="-45" y="4" width="7" height="9" fill="#fff0cf"/>
      </g>
      <rect x="-24" y="-7" width="38" height="26" fill="#e77a32"/>
      <rect x="4" y="-16" width="25" height="27" fill="#e77a32"/>
      <rect x="-7" y="7" width="23" height="12" fill="#fff0cf"/>
      <rect x="15" y="-3" width="18" height="13" fill="#fff0cf"/>
      <path d="M8-15l4-16 10 16zm16 0l8-14 3 17z" fill="#b95025"/>
      <rect x="24" y="-8" width="4" height="5" fill="#101827"/>
      <rect x="32" y="2" width="5" height="5" fill="#101827"/>
      <rect x="-17" y="14" width="9" height="14" fill="#cf6228">
        <animate attributeName="y" values="14;18;14" dur=".32s" repeatCount="indefinite"/>
      </rect>
      <rect x="5" y="14" width="9" height="14" fill="#cf6228">
        <animate attributeName="y" values="18;14;18" dur=".32s" repeatCount="indefinite"/>
      </rect>
      <rect x="-17" y="24" width="9" height="5" fill="#fff0cf"/>
      <rect x="5" y="24" width="9" height="5" fill="#fff0cf"/>
      <rect x="3" y="7" width="15" height="4" fill="#41e9ff"/>
      <rect x="9" y="9" width="5" height="6" fill="#ffcc4d"/>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="800">
      <rect x="340" y="18" width="178" height="24" rx="4" fill="#050914" fill-opacity=".75" stroke="#ffffff" stroke-opacity=".1"/>
      <text x="353" y="34" fill="#91a4bb" font-size="9" letter-spacing="1">◇ BUILD  ◇ WIN  ◇ LEAD</text>
      <rect x="850" y="18" width="76" height="24" rx="4" fill="#050914" fill-opacity=".75" stroke="#ffffff" stroke-opacity=".1"/>
      <text x="888" y="34" fill="#ffffff" font-size="11" text-anchor="middle">00:45</text>

      <g>
        <rect x="32" y="188" width="260" height="58" rx="4" fill="#ff9147">
          <animate attributeName="fill" values="#ff9147;#ffb078;#ff9147" dur="1.6s" repeatCount="indefinite"/>
        </rect>
        <rect x="38" y="194" width="248" height="46" rx="2" fill="none" stroke="#160b05" stroke-opacity=".32"/>
        <text x="162" y="212" fill="#160b05" font-size="10" text-anchor="middle" letter-spacing="2.5">CLICK ANYWHERE TO</text>
        <text x="162" y="231" fill="#160b05" font-size="14" text-anchor="middle" letter-spacing="2">PLAY THE REAL GAME →</text>
      </g>
      <text x="32" y="270" fill="#697e95" font-size="9" letter-spacing="1">KEYBOARD + TOUCH CONTROLS  •  SOUND  •  3 PETS = ZOOMIES</text>
    </g>
  </g>

  <rect x="2" y="2" width="956" height="296" rx="15" fill="none" stroke="#41e9ff" stroke-opacity=".28" stroke-width="2"/>
</svg>

