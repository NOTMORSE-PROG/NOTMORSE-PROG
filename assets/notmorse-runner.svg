<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Mark Andrei Condino — animated developer profile</title>
  <desc id="desc">A pixel corgi named Byte walks across a neon terminal, leaving the word SHIP in Morse code before reaching a deployment flag.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b14"/>
      <stop offset="0.52" stop-color="#111827"/>
      <stop offset="1" stop-color="#1b1032"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.48" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.2"/>
      <stop offset="0.7" stop-color="#60a5fa" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#93c5fd" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="petShadow" x="-30%" y="-30%" width="180%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="3" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="frame">
      <rect x="2" y="2" width="1196" height="276" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="280" fill="url(#background)"/>
    <rect width="1200" height="280" fill="url(#grid)"/>

    <!-- slow ambient lights -->
    <circle cx="1020" cy="52" r="150" fill="#7c3aed" opacity="0.08">
      <animate attributeName="r" values="120;170;120" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.05;0.12;0.05" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="255" r="130" fill="#0d9488" opacity="0.08">
      <animate attributeName="r" values="100;150;100" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.04;0.11;0.04" dur="10s" repeatCount="indefinite"/>
    </circle>

    <!-- terminal chrome -->
    <rect x="24" y="20" width="1152" height="238" rx="16" fill="#070a12" fill-opacity="0.5" stroke="#334155" stroke-opacity="0.85"/>
    <path d="M24 58H1176" stroke="#334155" stroke-opacity="0.85"/>
    <circle cx="49" cy="39" r="6" fill="#fb7185"/>
    <circle cx="70" cy="39" r="6" fill="#fbbf24"/>
    <circle cx="91" cy="39" r="6" fill="#34d399"/>
    <text x="112" y="44" fill="#64748b" font-family="Consolas, 'Courier New', monospace" font-size="13" letter-spacing="1.2">NOTMORSE://PROFILE/SHIP.EXE</text>
    <text x="1092" y="44" fill="#2dd4bf" font-family="Consolas, 'Courier New', monospace" font-size="12">ONLINE</text>
    <circle cx="1075" cy="39" r="4" fill="#2dd4bf" filter="url(#softGlow)">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>

    <!-- identity -->
    <text x="58" y="96" fill="#f8fafc" font-family="Consolas, 'Courier New', monospace" font-size="30" font-weight="700" letter-spacing="1.2">MARK ANDREI CONDINO</text>
    <rect x="58" y="108" width="390" height="3" rx="1.5" fill="url(#edge)" filter="url(#softGlow)"/>
    <text x="58" y="136" fill="#94a3b8" font-family="Consolas, 'Courier New', monospace" font-size="15" letter-spacing="1.1">FULL-STACK DEVELOPER  /  FREELANCER  /  BSIT '27</text>

    <!-- rotating proof line -->
    <text x="58" y="168" fill="#5eead4" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="700">
      &gt; shipped: 10+ websites · 3+ Android apps
      <animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;0.28;0.33;0.94;0.97;0.99;1" dur="15s" repeatCount="indefinite"/>
    </text>
    <text x="58" y="168" fill="#93c5fd" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="700" opacity="0">
      &gt; competed: 1st Place · Grundfos Hackathon
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.31;0.35;0.61;0.65;1" dur="15s" repeatCount="indefinite"/>
    </text>
    <text x="58" y="168" fill="#d8b4fe" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="700" opacity="0">
      &gt; building: AI, mobile, web &amp; on-chain products
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.63;0.67;0.94;1" dur="15s" repeatCount="indefinite"/>
    </text>
    <rect x="58" y="177" width="9" height="17" fill="#5eead4">
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
    </rect>

    <!-- deployment rail -->
    <path d="M66 231H1110" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
    <path d="M66 231H1110" stroke="url(#track)" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 11">
      <animate attributeName="stroke-dashoffset" values="0;-64" dur="2s" repeatCount="indefinite"/>
    </path>

    <!-- SHIP written as a Morse-code trail -->
    <g fill="#5eead4" opacity="0.75" filter="url(#softGlow)">
      <circle cx="130" cy="231" r="3"/><circle cx="144" cy="231" r="3"/><circle cx="158" cy="231" r="3"/>
      <circle cx="208" cy="231" r="3"/><circle cx="222" cy="231" r="3"/><circle cx="236" cy="231" r="3"/><circle cx="250" cy="231" r="3"/>
      <circle cx="300" cy="231" r="3"/><circle cx="314" cy="231" r="3"/>
      <circle cx="364" cy="231" r="3"/><rect x="376" y="229" width="22" height="4" rx="2"/><rect x="405" y="229" width="22" height="4" rx="2"/><circle cx="437" cy="231" r="3"/>
      <animate attributeName="opacity" values="0.15;0.95;0.45;0.15" keyTimes="0;0.28;0.76;1" dur="15s" repeatCount="indefinite"/>
    </g>
    <text x="462" y="236" fill="#475569" font-family="Consolas, 'Courier New', monospace" font-size="10" letter-spacing="2">SHIP // MORSE TRAIL</text>

    <!-- destination flag -->
    <g transform="translate(1100 188)">
      <path d="M0 0V50" stroke="#cbd5e1" stroke-width="3"/>
      <path d="M2 2H40L30 14L40 26H2Z" fill="#a855f7">
        <animate attributeName="d" values="M2 2H40L30 14L40 26H2Z;M2 2H44L32 14L43 26H2Z;M2 2H40L30 14L40 26H2Z" dur="1.2s" repeatCount="indefinite"/>
      </path>
      <text x="-11" y="65" fill="#94a3b8" font-family="Consolas, 'Courier New', monospace" font-size="10">DEPLOY</text>
    </g>

    <!-- pixel pet: BYTE -->
    <g filter="url(#petShadow)">
      <animateTransform attributeName="transform" type="translate" values="70 178;1018 178;1018 178;70 178" keyTimes="0;0.75;0.88;1" dur="15s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0;0 -2;0 0" dur="0.42s" repeatCount="indefinite"/>

        <!-- tail -->
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-15 9 30;18 9 30;-15 9 30" dur="0.45s" repeatCount="indefinite"/>
          <path d="M12 31H3V23H-5V14" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="square"/>
          <path d="M-5 14V8" stroke="#f8fafc" stroke-width="8" stroke-linecap="square"/>
        </g>

        <!-- back legs -->
        <rect x="18" y="43" width="10" height="15" rx="2" fill="#d97706">
          <animate attributeName="y" values="43;48;43" dur="0.42s" repeatCount="indefinite"/>
        </rect>
        <rect x="42" y="43" width="10" height="15" rx="2" fill="#d97706">
          <animate attributeName="y" values="48;43;48" dur="0.42s" repeatCount="indefinite"/>
        </rect>
        <rect x="16" y="54" width="14" height="5" rx="2" fill="#f8fafc"/>
        <rect x="40" y="54" width="14" height="5" rx="2" fill="#f8fafc"/>

        <!-- body -->
        <rect x="10" y="24" width="50" height="26" rx="8" fill="#f59e0b"/>
        <rect x="13" y="39" width="44" height="11" rx="5" fill="#f8fafc"/>
        <rect x="26" y="25" width="8" height="25" fill="#d97706" opacity="0.55"/>

        <!-- head and ears -->
        <path d="M48 12V1L57 10M70 10L79 1V16" fill="#d97706" stroke="#f59e0b" stroke-width="7" stroke-linejoin="miter"/>
        <rect x="46" y="10" width="36" height="32" rx="8" fill="#f59e0b"/>
        <path d="M48 11L55 4L60 12M69 12L75 4L80 13" fill="#fb7185" opacity="0.7"/>
        <rect x="53" y="28" width="27" height="14" rx="6" fill="#f8fafc"/>
        <rect x="56" y="20" width="5" height="6" rx="2" fill="#0f172a"/>
        <rect x="71" y="20" width="5" height="6" rx="2" fill="#0f172a"/>
        <rect x="63" y="30" width="7" height="5" rx="2" fill="#0f172a"/>
        <path d="M66 35V38M66 38L62 40M66 38L70 40" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>

        <!-- collar and tag -->
        <rect x="47" y="39" width="34" height="5" rx="2" fill="#2dd4bf"/>
        <circle cx="64" cy="46" r="5" fill="#60a5fa" stroke="#e0f2fe" stroke-width="1"/>
      </g>

      <!-- speech bubble travels with Byte -->
      <g transform="translate(78 2)" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.68;0.74;0.87;1" dur="15s" repeatCount="indefinite"/>
        <rect width="83" height="24" rx="7" fill="#f8fafc"/>
        <path d="M0 7L-9 13L0 18" fill="#f8fafc"/>
        <text x="11" y="16" fill="#0f172a" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="700">BYTE: SHIP IT!</text>
      </g>
    </g>

    <!-- arrival burst -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.74;0.78;0.87;1" dur="15s" repeatCount="indefinite"/>
      <g fill="#fbbf24">
        <rect x="1048" y="185" width="5" height="12" rx="2" transform="rotate(-28 1048 185)">
          <animateTransform attributeName="transform" type="translate" values="0 10;0 -20" dur="1.5s" repeatCount="indefinite" additive="sum"/>
        </rect>
        <rect x="1070" y="178" width="5" height="12" rx="2" transform="rotate(18 1070 178)">
          <animateTransform attributeName="transform" type="translate" values="0 10;7 -25" dur="1.3s" repeatCount="indefinite" additive="sum"/>
        </rect>
      </g>
      <g fill="#2dd4bf">
        <circle cx="1035" cy="197" r="4"><animate attributeName="cy" values="207;170" dur="1.2s" repeatCount="indefinite"/></circle>
        <circle cx="1090" cy="192" r="4"><animate attributeName="cy" values="202;162" dur="1.4s" repeatCount="indefinite"/></circle>
      </g>
      <g fill="#c084fc">
        <rect x="1058" y="190" width="7" height="7" transform="rotate(45 1061 193)"><animate attributeName="y" values="200;158" dur="1.1s" repeatCount="indefinite"/></rect>
        <rect x="1082" y="198" width="7" height="7" transform="rotate(45 1085 201)"><animate attributeName="y" values="208;168" dur="1.35s" repeatCount="indefinite"/></rect>
      </g>
    </g>
  </g>

  <rect x="2" y="2" width="1196" height="276" rx="22" fill="none" stroke="url(#edge)" stroke-width="3"/>
</svg>
